<script>
(() => {
  const KINDS = [
    { key: "review", label: "Reviews", icon: "eye", blurb: "Requested from you, reviewed before, or watched", ageLbl: "waiting" },
    { key: "reply", label: "Replies", icon: "msg", blurb: "DMs and mentions you did not answer or react to", ageLbl: "waiting" },
    { key: "task", label: "Tasks", icon: "issue", blurb: "Issues and to-dos assigned to you", ageLbl: "open" },
    { key: "followup", label: "Follow-ups", icon: "flag", blurb: "Things you said you would do", ageLbl: "since" },
    { key: "pr", label: "Your PRs", icon: "pr", blurb: "Your open PRs, updated in the last 30 days", ageLbl: "open" }
  ];
  const KIND = Object.fromEntries(KINDS.map(k => [k.key, k]));
  const SRC = {
    github: { icon: "code", name: "GitHub" },
    slack: { icon: "hash", name: "Slack" },
    linear: { icon: "layers", name: "Linear" },
    chat: { icon: "spark", name: "Claude chats" },
    manual: { icon: "pencil", name: "Added by you" }
  };
  const PRI = { urgent: 0, high: 1, normal: 2, low: 3 };
  const DAY = 86400000;

  const $ = s => document.querySelector(s);
  const I = (id, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const LOGO = sk => (sk === "manual" ? I("pencil") : `<svg class="logo" aria-hidden="true"><use href="#l-${sk}"/></svg>`);
  let db = null, items = [], meta = {}, digest = null, request = null, settings = null, wasPending = false;
  let srcFilter = "all", query = "", openSnooze = null;
  let phase = "connecting"; // connecting | ready | slow | missing | error
  let readOnly = false, lastUndo = null, toastTimer = null;
  const busy = new Set();
  const expanded = new Set();
  // Three looks share one page. The early script in the head turns on one style sheet; the dropdown switches it.
  const LOOK_SHEETS = { studio: ["studio"], glass: ["glass"], dusk: ["dusk"], flight: ["dusk", "flight"], topo: ["topo"], riso: ["riso"], classic: ["classic"] };
  const LOOKS = Object.keys(LOOK_SHEETS);
  let look = LOOKS.includes(document.documentElement.dataset.look) ? document.documentElement.dataset.look : "studio";

  // ---------- helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = u => {
    if (!u) return "";
    try { const x = new URL(String(u)); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; }
    catch { return ""; }
  };
  const ts = iso => { const v = Date.parse(iso); return Number.isFinite(v) ? v : NaN; };
  const kindOf = it => (KIND[it.kind] ? it.kind : "task");
  const srcOf = it => (SRC[it.source] ? it.source : "manual");
  const sinceOf = it => it.since || it.createdAt;

  function age(iso, n) {
    const v = ts(iso);
    if (!Number.isFinite(v)) return null;
    const m = Math.max(0, Math.floor((n - v) / 60000));
    if (m < 60) return { txt: m + "m", days: m / 1440 };
    const h = Math.floor(m / 60);
    if (h < 24) return { txt: h + "h", days: h / 24 };
    const d = Math.floor(h / 24);
    return { txt: d + "d", days: d };
  }
  const tone = days => (days >= 3 ? "stale" : days >= 1 ? "aging" : "fresh");
  function ago(iso, n) { const a = age(iso, n); return a ? (a.txt === "0m" ? "just now" : a.txt + " ago") : ""; }
  const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: "short" });
  const dateFmt = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" });
  const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
  const kickFmt = new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short" });
  const kickDay = new Intl.DateTimeFormat(undefined, { weekday: "long" });
  const kickMonth = new Intl.DateTimeFormat(undefined, { month: "long", year: "numeric" });
  const kickFull = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long" });
  const startOfDay = v => { const d = new Date(v); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const dayDiff = (v, n) => Math.round((startOfDay(v) - startOfDay(n)) / DAY);
  function when(iso, n) {
    const v = ts(iso);
    if (!Number.isFinite(v)) return "";
    const dd = dayDiff(v, n), tm = timeFmt.format(v);
    if (dd === 0) return "today " + tm;
    if (dd === 1) return "tomorrow " + tm;
    if (dd === -1) return "yesterday " + tm;
    if (dd > 1 && dd < 7) return dayFmt.format(v) + " " + tm;
    return dateFmt.format(v);
  }
  function dueInfo(iso, n) {
    const v = ts(iso);
    if (!Number.isFinite(v)) return null;
    const dd = dayDiff(v, n);
    if (dd < 0) return { short: "-" + (-dd) + "d", txt: "overdue by " + (-dd) + " days", tone: "bad", pressing: true };
    if (dd === 0) return { short: "today", txt: "due today", tone: "warn", pressing: true };
    if (dd === 1) return { short: "tmrw", txt: "due tomorrow", tone: "warn", pressing: true };
    if (dd < 7) return { short: dayFmt.format(v), txt: "due " + dayFmt.format(v), tone: "", pressing: false };
    return { short: dateFmt.format(v), txt: "due " + dateFmt.format(v), tone: "", pressing: false };
  }
  function effStatus(it, n) {
    if (it.status === "done") return "done";
    if (it.status === "snoozed" && ts(it.snoozedUntil) > n) return "snoozed";
    return "open";
  }
  function rank(a, b, n) {
    const pa = PRI[a.priority] ?? 2, pb = PRI[b.priority] ?? 2;
    if (pa !== pb) return pa - pb;
    const da = dueInfo(a.due, n), dbb = dueInfo(b.due, n);
    const xa = da && da.pressing ? 0 : 1, xb = dbb && dbb.pressing ? 0 : 1;
    if (xa !== xb) return xa - xb;
    return (ts(sinceOf(a)) || 0) - (ts(sinceOf(b)) || 0);
  }
  function matches(it) {
    if (srcFilter !== "all" && srcOf(it) !== srcFilter) return false;
    if (!query) return true;
    const hay = [it.title, it.where, it.from, it.note, it.state].join(" ").toLowerCase();
    return query.split(/\s+/).every(w => hay.includes(w));
  }
  function snoozeTargets(n) {
    const now = new Date(n);
    const tom = new Date(now); tom.setDate(now.getDate() + 1); tom.setHours(9, 0, 0, 0);
    const mon = new Date(now); mon.setDate(now.getDate() + (((8 - now.getDay()) % 7) || 7)); mon.setHours(9, 0, 0, 0);
    return [
      { label: "3h", tip: "3 hours", at: new Date(n + 3 * 3600000) },
      { label: "Tomorrow", tip: "Tomorrow " + timeFmt.format(tom), at: tom },
      { label: "Monday", tip: "Monday " + timeFmt.format(mon), at: mon }
    ];
  }
  function panel(title, body) { return `<div class="panel"><h2>${esc(title)}</h2><p>${esc(body)}</p></div>`; }

  // ---------- visual pieces ----------
  function ring(it, n, kindKey) {
    const a = age(sinceOf(it), n);
    if (!a) return "";
    const tn = kindKey === "pr" ? "" : tone(a.days);
    const len = Math.max(3, Math.min(1, a.days / 7) * 44);
    const k = KIND[kindKey];
    return `<span class="ring ${tn}" title="${esc(k.ageLbl + " " + a.txt + " · since " + when(sinceOf(it), n))}">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle class="trk" cx="10" cy="10" r="7"/><circle class="val" cx="10" cy="10" r="7" stroke-dasharray="${len.toFixed(1)} 44" transform="rotate(-90 10 10)"/></svg>${a.txt}</span>`;
  }
  function priGlyph(p) {
    if (p === "urgent") return `<svg class="pri" viewBox="0 0 14 14" role="img" aria-label="Urgent"><title>Urgent</title><rect x="0.5" y="0.5" width="13" height="13" rx="3.5" fill="var(--stale)"/><path d="M7 3.6v4.3" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="10.4" r="1.1" fill="var(--bg)"/></svg>`;
    const on = p === "high" ? 3 : p === "low" ? 1 : 0;
    if (!on) return "";
    const color = p === "high" ? "var(--aging)" : "var(--faint)";
    const bars = [[1, 8, 5], [5.5, 5, 8], [10, 2, 11]].map(([x, y, h], i) =>
      `<rect x="${x}" y="${y}" width="3" height="${h}" rx="1" fill="${color}" opacity="${i < on ? 1 : .25}"/>`).join("");
    const label = p === "high" ? "High priority" : "Low priority";
    return `<svg class="pri" viewBox="0 0 14 14" role="img" aria-label="${label}"><title>${label}</title>${bars}</svg>`;
  }
  // Turn the source state text into small status glyphs. Each glyph keeps the full text as its label.
  function stateGlyphs(it) {
    const s = String(it.state || "");
    const v = s.toLowerCase();
    const out = [];
    const add = (icon, cls, label, text = "") => out.push({ icon, cls, label, text });
    const un = v.match(/(\d+)\s+unanswered/);
    if (un) add("msg", "pill warn", un[1] + " unanswered messages", un[1]);
    if (/\bdraft\b/.test(v)) add("draft", "", "Draft");
    if (/^approved/.test(v)) add("ok", "good", "Approved");
    if (/^changes requested/.test(v)) add("xc", "bad", "Changes requested");
    if (/waiting for review/.test(v)) add("clock", "", "Waiting for review");
    if (/checks failing/.test(v)) add("warn", "bad", "Checks failing");
    if (/new commits/.test(v)) add("commit", "warn", "New commits since your review");
    if (/you approved/.test(v)) add("ok", "", "You approved");
    if (/you requested changes/.test(v)) add("xc", "", "You requested changes");
    if (/you reviewed/.test(v)) add("check", "", "You reviewed");
    if (/watching/.test(v)) add("eye", "", "Watching");
    if (/team request/.test(v)) add("users", "", "Team request");
    if (!out.length && s && kindOf(it) === "task") {
      if (/pending|blocked|waiting|feedback/.test(v)) add("pause", "warn", s);
      else if (/todo|backlog|triage|unstarted/.test(v)) add("circle", "", s);
      else add("half", "kind", s);
    }
    if (!out.length && s && !un && !/^open$/.test(v)) add("circle", "", s);
    return out;
  }
  function glyphHTML(g) {
    return `<span class="g ${g.cls}" title="${esc(g.label)}" role="img" aria-label="${esc(g.label)}">${I(g.icon, "sm")}${g.text ? esc(g.text) : ""}</span>`;
  }
  function initials(name) {
    const clean = String(name).replace(/^@/, "").trim();
    const words = clean.split(/[\s._-]+/).filter(Boolean);
    if (words.length >= 2) return (words[0][0] + words[words.length - 1][0]).toUpperCase();
    const camel = clean.match(/^([a-zA-Z])[a-z]*([A-Z])/);
    if (camel) return (camel[1] + camel[2]).toUpperCase();
    return clean.slice(0, 1).toUpperCase();
  }
  function hue(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 6; }
  function avatars(from) {
    const names = String(from || "").split(",").map(s => s.trim()).filter(Boolean);
    if (!names.length) return "";
    const shown = names.slice(0, 3).map(nm => `<span class="av av${hue(nm)}" title="${esc(nm)}">${esc(initials(nm))}</span>`).join("");
    const more = names.length > 3 ? `<span class="av more" title="${esc(names.slice(3).join(", "))}">+${names.length - 3}</span>` : "";
    return `<span class="avs" role="img" aria-label="${esc("From " + names.join(", "))}">${shown}${more}</span>`;
  }
  function titleHTML(it, cls) {
    const url = safeUrl(it.url), t = esc(it.title || "Untitled");
    return url ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${t}</a>` : `<span class="${cls}">${t}</span>`;
  }

  // ---------- render ----------
  function render() {
    const n = Date.now();
    const fk = focusKey();
    const open = [], snoozed = [], done = [];
    for (const it of items) {
      const s = effStatus(it, n);
      if (s === "open") open.push(it);
      else if (s === "snoozed") snoozed.push(it);
      else if (!Number.isFinite(ts(it.doneAt)) || n - ts(it.doneAt) < 7 * DAY) done.push(it);
    }
    renderKicker(open, n);
    renderSources(open, n);
    renderUpdate(n);
    renderBrief(n);
    renderSummary(open, done, n);
    renderBanner();
    renderBoard(open, n);
    renderDrawers(snoozed, done, n);
    $("#addBtn").hidden = readOnly || !db;
    if (fk) { const el = document.querySelector(fk); if (el) el.focus({ preventScroll: true }); }
  }
  function focusKey() {
    const a = document.activeElement;
    if (!a || !a.dataset || !a.dataset.act) return null;
    let k = `[data-act="${a.dataset.act}"]`;
    if (a.dataset.id) k += `[data-id="${CSS.escape(a.dataset.id)}"]`;
    if (a.dataset.src) k += `[data-src="${CSS.escape(a.dataset.src)}"]`;
    return k;
  }

  // The line above the title: today's date, the open count, and the last sync.
  function renderKicker(open, n) {
    $("#kickN").textContent = new Date(n).getDate();
    const parts = look === "studio" ? [kickDay.format(n), kickMonth.format(n)]
      : (look === "glass" || look === "dusk" || look === "flight" || look === "topo") ? [kickFull.format(n)]
      : [kickFmt.format(n)];
    if (db && (phase === "ready" || items.length)) {
      const last = lastSyncAt();
      if (look === "riso" || look === "classic") parts.push(open.length + " open");
      parts.push(Number.isFinite(last) ? "synced " + ago(new Date(last).toISOString(), n) : "not synced yet");
    }
    $("#kicker").textContent = parts.join(" · ");
  }

  function syncState(key, n) {
    const r = meta && meta[key];
    if (key === "manual") return { cls: "", tip: "" };
    if (!r || !r.at) return { cls: "off", tip: "not synced yet" };
    if (r.skipped) return { cls: "off", tip: "not connected" };
    if (r.ok === false) return { cls: "err", tip: "sync failed " + ago(r.at, n) + (r.error ? " · " + r.error : "") };
    const hrs = (n - ts(r.at)) / 3600000;
    if (key === "chat") return { cls: "ok", tip: "last added " + ago(r.at, n) };
    return { cls: hrs < 2 ? "ok" : "old", tip: "synced " + ago(r.at, n) };
  }
  function renderSources(open, n) {
    const counts = {};
    for (const i of open) counts[srcOf(i)] = (counts[srcOf(i)] || 0) + 1;
    const keys = ["github", "slack", "linear", "chat", "manual"].filter(k => k !== "manual" || counts.manual || srcFilter === "manual");
    const all = `<button class="srcbtn" type="button" data-act="src" data-src="all" aria-pressed="${srcFilter === "all"}" title="All sources · ${open.length} open">${I("inbox")}${open.length}</button>`;
    $("#srcs").innerHTML = all + keys.map(k => {
      const s = syncState(k, n);
      const c = counts[k] || 0;
      const tip = `${SRC[k].name} · ${c} open${s.tip ? " · " + s.tip : ""}`;
      return `<button class="srcbtn" type="button" data-act="src" data-src="${k}" aria-pressed="${srcFilter === k}" title="${esc(tip)}" aria-label="${esc(tip)}">${LOGO(k)}${s.cls ? `<span class="dot ${s.cls}"></span>` : ""}${c}</button>`;
    }).join("");
  }

  function renderSummary(open, done, n) {
    const el = $("#summary");
    if (phase === "missing") { el.innerHTML = `<p class="msg">This page can't reach its list.</p>`; return; }
    if (!items.length && (phase === "connecting" || phase === "slow")) { el.innerHTML = `<p class="msg">${phase === "slow" ? "Still trying to reach your list…" : "Connecting…"}</p>`; return; }
    const byKind = KINDS.map(k => ({ k, c: open.filter(i => kindOf(i) === k.key).length }));
    const urgent = open.filter(i => i.priority === "urgent").length;
    const stale = open.filter(i => { const a = age(sinceOf(i), n); return a && a.days >= 3 && kindOf(i) !== "pr"; }).length;
    const flags = `<div class="flags">
        <span class="flag bad ${urgent ? "on" : ""}" title="${urgent} urgent">${priGlyph("urgent")}${urgent}</span>
        <span class="flag warn ${stale ? "on" : ""}" title="${stale} waiting 3 days or more">${I("clock", "sm")}${stale}</span>
      </div>`;
    const legend = byKind.map(x => `<span data-kind="${x.k.key}" title="${esc(x.k.label + " · " + x.c + " open")}">${I(x.k.icon, "sm")}<b>${x.c}</b><span class="lg-l">${esc(x.k.label)}</span></span>`).join("");
    const mixLabel = esc(byKind.map(x => x.k.label + " " + x.c).join(", "));
    if (look === "studio" || look === "glass") {
      // One dot per open item, grouped by column; then the last 7 days of closed items.
      const dots = open.length
        ? byKind.map(x => `<i data-kind="${x.k.key}"></i>`.repeat(x.c)).join("")
        : `<span class="none">Nothing open</span>`;
      const today = startOfDay(n), days = [];
      for (let i = 6; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); days.push(d.getTime()); }
      const perDay = days.map(d => done.filter(it => startOfDay(ts(it.doneAt)) === d).length);
      const total = perDay.reduce((a, b) => a + b, 0);
      const week = days.map((d, i) => {
        const c = perDay[i], isToday = i === 6;
        const tip = (isToday ? "Today" : dayFmt.format(d) + " " + dateFmt.format(d)) + " · " + c + " done";
        return `<li class="${c ? "hit" : ""}${isToday ? " today" : ""}" title="${esc(tip)}"><span class="wc">${c ? I("check") : new Date(d).getDate()}</span><span class="wl">${esc(isToday ? "Today" : dayFmt.format(d))}</span></li>`;
      }).join("");
      el.innerHTML = `
        <div class="tile t-open"><span class="tl">Open</span><span class="num">${open.length}</span>${flags}</div>
        <div class="tile t-mix"><span class="tl">By column</span><div class="dots" role="img" aria-label="${mixLabel}">${dots}</div><div class="legend">${legend}</div></div>
        <div class="tile t-week"><span class="tl">Done · last 7 days <b>${total}</b></span><ol class="week" aria-label="Items done each day">${week}</ol></div>`;
      return;
    }
    const bar = open.length
      ? byKind.filter(x => x.c).map(x => `<span data-kind="${x.k.key}" style="flex:${x.c}" title="${esc(x.k.label + " · " + x.c)}"></span>`).join("")
      : `<span class="empty" title="Nothing open"></span>`;
    el.innerHTML = `
      <div class="total"><span class="num">${open.length}<span class="mis" aria-hidden="true">${open.length}</span></span><span class="lbl">open</span></div>
      <div class="dist"><div class="bar" role="img" aria-label="${mixLabel}">${bar}</div><div class="legend">${legend}</div></div>
      ${flags}`;
  }

  // Update button: the page writes meta/request; the Claude Code loop (/loop 5m /track-items tick) sees it and syncs.
  const STALE_MS = 12 * 60000;
  function lastSyncAt() {
    let best = ts(meta && meta.runAt);
    for (const k of ["github", "slack", "linear"]) { const v = ts(meta && meta[k] && meta[k].at); if (Number.isFinite(v) && !(best >= v)) best = v; }
    return best;
  }
  const isPending = () => !!(request && request.requestedAt && !(ts(request.handledAt) >= ts(request.requestedAt)));
  function renderUpdate(n) {
    const btn = $("#updBtn"), note = $("#updNote");
    btn.hidden = readOnly || !db;
    const pending = isPending();
    if (wasPending && !pending && request && request.handledAt) toast("Updated");
    wasPending = pending;
    const last = lastSyncAt();
    const lastTxt = Number.isFinite(last) ? "last sync " + ago(new Date(last).toISOString(), n) : "no sync yet";
    btn.classList.toggle("pending", pending);
    btn.title = pending ? "Update requested " + ago(request.requestedAt, n) + " · waiting for Claude Code" : "Update now · " + lastTxt;
    btn.setAttribute("aria-label", btn.title);
    const stale = pending && n - ts(request.requestedAt) > STALE_MS;
    note.hidden = !stale;
    if (stale) {
      note.innerHTML = `${I("warn", "sm")}<span>No Claude Code session took the update. Start the loop in a terminal:</span>
        <code>cd ~/.claude/skills/track-items &amp;&amp; claude</code><span>then</span><code>/loop 5m /track-items tick</code>
        <button class="btn" type="button" data-act="copy" data-text="/loop 5m /track-items tick">Copy loop command</button>`;
    }
  }
  async function requestUpdate() {
    if (!db || readOnly || isPending()) return;
    const now = new Date().toISOString();
    try {
      if (request) await tryTwice(() => db.doc("meta/request").update({ requestedAt: now }));
      else await tryTwice(() => db.doc("meta/request").set({ requestedAt: now, handledAt: null }));
      toast("Update requested");
    } catch (e) { writeFailed(e); }
  }

  // The daily brief: one document per day in "digests", written by the track-items skill after 10:00.
  // Work week and brief hour come from meta/settings (default: Sunday to Thursday, 10:00).
  const workdays = () => (settings && Array.isArray(settings.workdays) && settings.workdays.length ? settings.workdays : [0, 1, 2, 3, 4]);
  const briefHour = () => (settings && Number.isFinite(settings.briefHour) ? settings.briefHour : 10);
  function briefChip(n) {
    const now = new Date(n), bh = briefHour();
    if (!workdays().includes(now.getDay())) return `<span class="old calm" title="No brief on weekend days. The next workday's brief covers the weekend too.">Weekend</span>`;
    if (now.getHours() < bh) return `<span class="old calm" title="Today's brief comes with the first sync after ${bh}:00">Next brief at ${bh}:00</span>`;
    return `<span class="old" title="Today's brief comes with the first sync after ${bh}:00">Not updated today</span>`;
  }
  // "Thu", "yesterday", "today 10:00", or a date. Midnight starts show the day only.
  function sinceLabel(iso, n) {
    const v = ts(iso);
    if (!Number.isFinite(v)) return "";
    const d = new Date(v), dd = dayDiff(v, n);
    const tm = d.getHours() === 0 && d.getMinutes() === 0 ? "" : " " + timeFmt.format(v);
    if (dd === 0) return "today" + tm;
    if (dd === -1) return "yesterday" + tm;
    if (dd >= -6 && dd <= -2) return dayFmt.format(v) + tm;
    return dateFmt.format(v);
  }
  function localDate(v) { const d = new Date(v); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function renderBrief(n) {
    const el = $("#brief");
    if (phase === "missing" || phase === "error") { el.hidden = true; return; }
    el.hidden = false;
    if (!digest) {
      el.innerHTML = `<div class="brief-empty">${I("sun")}<span>${phase === "ready" ? "Your daily brief appears after the first sync after 10:00." : "Loading the daily brief…"}</span></div>`;
      return;
    }
    const isToday = digest.date === localDate(n);
    const dayName = Number.isFinite(ts(digest.date + "T12:00:00")) ? new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric" }).format(new Date(digest.date + "T12:00:00")) : digest.date;
    const cols = [
      { key: "done", icon: "ok", label: digest.windowStart ? "Done since " + sinceLabel(digest.windowStart, n) : "Done" },
      { key: "inProgress", icon: "half", label: "In progress" },
      { key: "pending", icon: "circle", label: "Pending today" }
    ];
    const tagTone = t => /urgent|overdue|fail/i.test(t) ? "bad" : /new commits|due|high/i.test(t) ? "warn" : "";
    const li = b => {
      const sk = SRC[b.source] ? b.source : "manual";
      const url = safeUrl(b.url);
      const text = url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(b.text)}</a>` : esc(b.text);
      const tag = b.tag ? `<span class="tag ${tagTone(b.tag)}">${esc(b.tag)}</span>` : "";
      return `<li><span class="bs" title="${esc(SRC[sk].name)}">${LOGO(sk)}</span><span>${text}${tag}</span></li>`;
    };
    el.innerHTML = `
      <div class="brief-head">
        ${I("sun")}<h2>Daily brief · ${esc(dayName)}</h2>
        ${isToday ? "" : briefChip(n)}
        <span class="meta" title="${esc("Built " + when(digest.generatedAt, n))}">${esc(timeFmt.format(ts(digest.generatedAt) || n))}</span>
      </div>
      <div class="brief-cols">${cols.map(c => {
        const list = Array.isArray(digest[c.key]) ? digest[c.key] : [];
        const count = digest.stats && Number.isFinite(digest.stats[c.key]) ? digest.stats[c.key] : list.length;
        return `<section class="bcol" data-b="${c.key}">
          <div class="bcol-head">${I(c.icon)}<span>${esc(c.label)}</span><span class="n">${count}</span></div>
          <ul class="blist">${list.length ? list.map(li).join("") : `<li><span></span><span class="none">Nothing</span></li>`}</ul>
        </section>`;
      }).join("")}</div>`;
  }

  function renderBanner() {
    const el = $("#banner");
    if (phase === "missing") { el.innerHTML = panel("Open this page on claude.ai", "Sign in with the account that owns it. The items live in the page's private database."); return; }
    if (phase === "error") { el.innerHTML = panel("The list stopped updating", "Reload the page to connect again."); return; }
    if (phase === "slow" && items.length) { el.innerHTML = `<p class="notice">Can't reach the latest data. What you see may be out of date.</p>`; return; }
    if (phase === "ready" && !items.length) {
      el.innerHTML = `<div class="panel"><h2>Nothing tracked yet</h2>
        <ul class="ways">
          <li>${I("sync")}<span>Run <code>/track-items sync</code> in Claude Code.</span></li>
          <li>${I("spark")}<span>Say <code>track this</code> in any chat.</span></li>
          <li>${I("plus")}<span>Use the + button.</span></li>
        </ul></div>`;
      return;
    }
    el.innerHTML = "";
  }

  function cardHTML(it, n) {
    const k = KIND[kindOf(it)];
    const sk = srcOf(it);
    const id = esc(it.id);
    const isOpen = expanded.has(it.id);
    const due = dueInfo(it.due, n);
    const glyphs = stateGlyphs(it);
    const dis = busy.has(it.id) ? " disabled" : "";
    const dueG = due ? `<span class="g ${due.tone}" title="${esc(due.txt)}" role="img" aria-label="${esc(due.txt)}">${I("cal", "sm")}${esc(due.short)}</span>` : "";
    const acts = readOnly ? "" : `
        <button class="ab" type="button" data-act="snooze" data-id="${id}" aria-expanded="${openSnooze === it.id}" title="Snooze" aria-label="Snooze"${dis}>${I("clock")}</button>
        <button class="ab done" type="button" data-act="done" data-id="${id}" title="Mark done" aria-label="Mark done"${dis}>${I("check")}</button>`;
    const snz = (!readOnly && openSnooze === it.id) ? `<div class="snz" role="group" aria-label="Snooze until">
        ${snoozeTargets(n).map(s => `<button type="button" data-act="snooze-to" data-id="${id}" data-at="${s.at.toISOString()}" title="${esc(s.tip)}">${esc(s.label)}</button>`).join("")}
      </div>` : "";
    let more = "";
    if (isOpen) {
      const facts = [];
      for (const g of glyphs) facts.push(`<li class="${g.cls.replace("pill", "").trim()}">${I(g.icon, "sm")}${esc(g.label)}</li>`);
      if (it.priority && it.priority !== "normal") facts.push(`<li>${priGlyph(it.priority)}${esc(it.priority[0].toUpperCase() + it.priority.slice(1))} priority</li>`);
      if (it.from) facts.push(`<li>${I("users", "sm")}${esc(it.from)}</li>`);
      facts.push(`<li>${I("clock", "sm")}${esc(k.ageLbl + " since " + when(sinceOf(it), n))}</li>`);
      if (due) facts.push(`<li class="${due.tone}">${I("cal", "sm")}${esc(due.txt)}</li>`);
      facts.push(`<li>${LOGO(sk)}${esc(SRC[sk].name + (it.where ? " · " + it.where : ""))}</li>`);
      more = `<div class="c-more">${it.note ? `<p>${esc(it.note)}</p>` : ""}<ul class="facts">${facts.join("")}</ul></div>`;
    }
    return `<article class="card${isOpen ? " open" : ""}${busy.has(it.id) ? " busy" : ""}" data-card="${id}">
      <div class="c-top">
        <span class="src" title="${esc(SRC[sk].name)}" role="img" aria-label="${esc(SRC[sk].name)}">${LOGO(sk)}</span>
        <span class="where" title="${esc(it.where || "")}">${esc(it.where || SRC[sk].name)}</span>
        ${ring(it, n, k.key)}
      </div>
      ${titleHTML(it, "c-title")}
      <div class="c-bot">
        ${avatars(it.from)}
        <span class="glyphs">${priGlyph(it.priority)}${glyphs.map(glyphHTML).join("")}${dueG}</span>
        <span class="acts">${acts}
          <button class="ab more" type="button" data-act="expand" data-id="${id}" aria-expanded="${isOpen}" title="Details" aria-label="Details">${I("chev")}</button>
        </span>
      </div>
      ${snz}
      ${more}
    </article>`;
  }

  function renderBoard(open, n) {
    const el = $("#board");
    if (phase === "missing" || phase === "error") { el.innerHTML = ""; return; }
    const loading = !items.length && (phase === "connecting" || phase === "slow");
    const filtering = srcFilter !== "all" || !!query;
    el.innerHTML = KINDS.map(k => {
      const list = open.filter(i => kindOf(i) === k.key && matches(i)).sort((a, b) => rank(a, b, n));
      const body = loading ? `<div class="col-empty">${I(k.icon)}<span>Loading</span></div>`
        : list.length ? list.map(i => cardHTML(i, n)).join("")
        : `<div class="col-empty">${I(filtering ? "search" : "check")}<span>${filtering ? "No matches" : "Clear"}</span></div>`;
      return `<section class="col" data-kind="${k.key}" aria-labelledby="h-${k.key}">
        <header class="col-head" title="${esc(k.blurb)}">
          <span class="badge">${I(k.icon)}</span>
          <h2 class="col-name" id="h-${k.key}">${esc(k.label)}</h2>
          <span class="col-count">${list.length}</span>
        </header>
        ${body}
      </section>`;
    }).join("");
  }

  function archRow(it, n, which) {
    const sk = srcOf(it), id = esc(it.id);
    const dis = busy.has(it.id) ? " disabled" : "";
    const meta = which === "snoozed"
      ? `<span class="when" title="${esc("Snoozed until " + when(it.snoozedUntil, n))}">${I("clock", "sm")}${esc(when(it.snoozedUntil, n))}</span>`
      : `<span class="when" title="${esc("Done " + (ago(it.doneAt, n) || "") + (it.closedBy === "sync" ? " · closed at the source" : " · by you"))}">${I(it.closedBy === "sync" ? "sync" : "check", "sm")}${esc(ago(it.doneAt, n))}</span>`;
    const btn = readOnly ? "<span></span>" : which === "snoozed"
      ? `<button class="ab" type="button" data-act="wake" data-id="${id}" title="Wake now" aria-label="Wake now"${dis}>${I("sun")}</button>`
      : `<button class="ab" type="button" data-act="reopen" data-id="${id}" title="Reopen" aria-label="Reopen"${dis}>${I("undo")}</button>`;
    return `<div class="arow"><span class="src" title="${esc(SRC[sk].name)}">${LOGO(sk)}</span>${titleHTML(it, "t")}${meta}${btn}</div>`;
  }
  function renderDrawers(snoozed, done, n) {
    snoozed.sort((a, b) => ts(a.snoozedUntil) - ts(b.snoozedUntil));
    done.sort((a, b) => (ts(b.doneAt) || 0) - (ts(a.doneAt) || 0));
    $("#snoozedN").textContent = snoozed.length;
    $("#doneN").textContent = done.length;
    $("#snoozedRows").innerHTML = snoozed.length ? snoozed.map(i => archRow(i, n, "snoozed")).join("") : `<p class="arch-empty">${I("check", "sm")}Nothing snoozed</p>`;
    $("#doneRows").innerHTML = done.length ? done.slice(0, 60).map(i => archRow(i, n, "done")).join("") : `<p class="arch-empty">${I("circle", "sm")}Nothing yet</p>`;
  }

  // ---------- writes ----------
  async function tryTwice(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
      throw e;
    }
  }
  function writeFailed(e) {
    const code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted" || code === "revoked") { readOnly = true; toast("You can view this list, but you can't change it."); }
    else if (code === "quota_exceeded") toast("The list is full. Remove old done items, then try again.");
    else toast("Not saved. Check your connection and try again.");
  }
  async function write(id, data, msg, undoData) {
    if (!db || readOnly || busy.has(id)) return;
    busy.add(id); openSnooze = null; render();
    try {
      await tryTwice(() => db.collection("items").doc(id).update({ ...data, updatedAt: new Date().toISOString() }));
      if (msg) toast(msg, undoData ? { id, data: undoData } : null);
    } catch (e) { writeFailed(e); }
    finally { busy.delete(id); render(); }
  }
  function toast(msg, undo) {
    const el = $("#toast");
    lastUndo = undo || null;
    el.innerHTML = `<span>${esc(msg)}</span>` + (undo ? `<button class="toast-btn" type="button" data-act="undo">Undo</button>` : "");
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; lastUndo = null; }, 6000);
  }

  // ---------- events ----------
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]");
    if (!b) {
      const card = e.target.closest(".card");
      if (card && !e.target.closest("a, .c-more")) {
        const id = card.dataset.card;
        expanded.has(id) ? expanded.delete(id) : expanded.add(id);
        render();
      }
      return;
    }
    const act = b.dataset.act, id = b.dataset.id, n = Date.now();
    if (act === "src") { srcFilter = b.dataset.src; openSnooze = null; render(); return; }
    if (act === "expand") { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); return; }
    if (act === "snooze") { openSnooze = openSnooze === id ? null : id; render(); return; }
    if (act === "snooze-to") { await write(id, { status: "snoozed", snoozedUntil: b.dataset.at }, "Snoozed until " + when(b.dataset.at, n), { status: "open", snoozedUntil: null }); return; }
    if (act === "done") { await write(id, { status: "done", doneAt: new Date(n).toISOString(), closedBy: "you", snoozedUntil: null }, "Done", { status: "open", doneAt: null, closedBy: null }); return; }
    if (act === "wake") { await write(id, { status: "open", snoozedUntil: null }, "Back on the board"); return; }
    if (act === "reopen") { await write(id, { status: "open", doneAt: null, closedBy: null }, "Reopened"); return; }
    if (act === "undo") { const u = lastUndo; lastUndo = null; $("#toast").hidden = true; if (u) await write(u.id, u.data, "Restored"); return; }
    if (act === "add") { const f = $("#addForm"); f.hidden = !f.hidden; if (!f.hidden) $("#f-title").focus(); return; }
    if (act === "add-cancel") { $("#addForm").reset(); $("#addForm").hidden = true; return; }
    if (act === "update") { await requestUpdate(); return; }
    if (act === "copy") {
      const text = b.dataset.text || "/track-items sync";
      try { await navigator.clipboard.writeText(text); toast("Copied " + text); }
      catch { toast("Run " + text + " in Claude Code"); }
    }
  });
  $("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
  function setLook(v) {
    look = LOOKS.includes(v) ? v : "studio";
    for (const s of document.querySelectorAll("style[id^='look-']")) s.media = LOOK_SHEETS[look].includes(s.id.slice(5)) ? "all" : "not all";
    document.documentElement.dataset.look = look;
    try { localStorage.setItem("active-items-look", look); } catch { /* the choice is a per-viewer convenience */ }
    render();
    drawTopo();
  }
  // Topo look: draw contour lines once on a fixed canvas behind the page. Redraw on resize and theme change.
  const HILLS = [[.16, .22, .2, 1], [.7, .18, .16, .85], [.52, .72, .24, 1.15], [.92, .78, .14, .7], [.28, .74, .11, .55], [.4, .4, .09, .35]];
  // Marching squares: corner bits TL=8, TR=4, BR=2, BL=1. Edges: 0 top, 1 right, 2 bottom, 3 left.
  const SEGS = { 1: [[3, 2]], 2: [[2, 1]], 3: [[3, 1]], 4: [[0, 1]], 5: [[0, 1], [3, 2]], 6: [[0, 2]], 7: [[0, 3]], 8: [[0, 3]], 9: [[0, 2]], 10: [[0, 3], [2, 1]], 11: [[0, 1]], 12: [[3, 1]], 13: [[2, 1]], 14: [[3, 2]] };
  function drawTopo() {
    const cv = document.getElementById("topo");
    if (!cv || look !== "topo") return;
    const w = window.innerWidth, h = window.innerHeight;
    const ctx = cv.getContext && cv.getContext("2d");
    if (!w || !h || !ctx) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const cs = getComputedStyle(document.documentElement);
    const minor = cs.getPropertyValue("--contour").trim() || "rgba(0, 0, 0, .15)";
    const major = cs.getPropertyValue("--contour-index").trim() || "rgba(0, 0, 0, .3)";
    const S = 8, cols = Math.ceil(w / S) + 1, rows = Math.ceil(h / S) + 1;
    const g = new Float32Array(cols * rows);
    let max = 0;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const x = i * S / w, y = j * S / w; // one scale for both axes keeps the hills round
      let v = 0;
      for (const [cx, cy, r, a] of HILLS) { const dx = x - cx, dy = y - cy * h / w; v += a * Math.exp(-(dx * dx + dy * dy) / (2 * r * r)); }
      g[j * cols + i] = v;
      if (v > max) max = v;
    }
    const STEP = .055;
    for (let k = 1; k * STEP < max; k++) {
      const L = k * STEP;
      ctx.beginPath();
      for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
        const a = g[j * cols + i], b = g[j * cols + i + 1], c = g[(j + 1) * cols + i + 1], d = g[(j + 1) * cols + i];
        const segs = SEGS[(a > L ? 8 : 0) | (b > L ? 4 : 0) | (c > L ? 2 : 0) | (d > L ? 1 : 0)];
        if (!segs) continue;
        const pt = e => e === 0 ? [i + (L - a) / (b - a), j] : e === 1 ? [i + 1, j + (L - b) / (c - b)] : e === 2 ? [i + (L - d) / (c - d), j + 1] : [i, j + (L - a) / (d - a)];
        for (const [e1, e2] of segs) { const p = pt(e1), q = pt(e2); ctx.moveTo(p[0] * S, p[1] * S); ctx.lineTo(q[0] * S, q[1] * S); }
      }
      const index = k % 5 === 0; // every fifth line is an index contour
      ctx.strokeStyle = index ? major : minor;
      ctx.lineWidth = index ? 1.3 : .7;
      ctx.stroke();
    }
  }
  let topoTimer = null;
  window.addEventListener("resize", () => { clearTimeout(topoTimer); topoTimer = setTimeout(drawTopo, 200); });
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawTopo); } catch { /* old browsers: no live theme change */ }
  new MutationObserver(drawTopo).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  $("#look").value = look;
  $("#look").addEventListener("change", e => setLook(e.target.value));
  drawTopo();
  $("#addForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!db || readOnly) return;
    const title = $("#f-title").value.trim();
    if (!title) return;
    const nowIso = new Date().toISOString(), dueV = $("#f-due").value;
    const doc = {
      source: "manual", kind: $("#f-kind").value, title,
      url: safeUrl($("#f-url").value.trim()) || null, where: "", from: "",
      note: $("#f-note").value.trim(), state: "", priority: $("#f-pri").value,
      since: nowIso, due: dueV ? new Date(dueV + "T12:00:00").toISOString() : null,
      status: "open", snoozedUntil: null, doneAt: null, closedBy: null, createdAt: nowIso, updatedAt: nowIso
    };
    try {
      await tryTwice(() => db.collection("items").doc("manual:" + Date.now().toString(36)).set(doc));
      $("#addForm").reset(); $("#addForm").hidden = true; toast("Added");
    } catch (err) { writeFailed(err); }
  });

  // ---------- start ----------
  render();
  // Ages tick once a minute, and only while the tab is visible.
  setInterval(() => { if (!document.hidden) render(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  (async () => {
    const use = name => (window.claude && typeof window.claude.use === "function") ? window.claude.use(name) : Promise.resolve(null);
    const timer = setTimeout(() => { if (phase === "connecting") { phase = "slow"; render(); } }, 10000);
    let dbNs = null, userNs = null;
    try { [dbNs, userNs] = await Promise.all([use("db"), use("user")]); } catch { /* treated as absent */ }
    if (userNs) { try { readOnly = !(await userNs.isOwner()); } catch { /* a refused write decides */ } }
    if (!dbNs) { clearTimeout(timer); phase = "missing"; render(); return; }
    db = dbNs;
    db.collection("items").onSnapshot(snap => {
      items = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { clearTimeout(timer); phase = "ready"; }
      render();
    }, () => { clearTimeout(timer); phase = "error"; render(); });
    db.doc("meta/sync").onSnapshot(s => { meta = s.exists ? (s.data() || {}) : {}; render(); }, () => {});
    db.doc("meta/request").onSnapshot(s => { request = s.exists ? (s.data() || null) : null; render(); }, () => {});
    db.doc("meta/settings").onSnapshot(s => { settings = s.exists ? (s.data() || null) : null; render(); }, () => {});
    db.collection("digests").orderBy("date", "desc").limit(1).onSnapshot(s => {
      const d = s.docs.find(x => x.exists);
      digest = d ? d.data() : null;
      render();
    }, () => {});
  })();
})();
</script>
